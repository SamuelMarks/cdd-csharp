ci:
    skip: [dotnet-format, web-ui-tests, wasm-lint]

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: mixed-line-ending
        args: ['--fix=lf']
        exclude: \.(bat|cmd|ps1)$

-   repo: local
    hooks:
    -   id: dotnet-format
        name: Dotnet Format
        entry: python3 scripts/fallback_runner.py dotnet format whitespace CddOpenApi.slnx
        language: system
        files: \.cs$
        pass_filenames: true

    -   id: web-ui-tests
        name: Run Web UI C# Tests
        entry: python3 scripts/run_slow.py python3 scripts/fallback_runner.py python3 run_web_ui_test.py
        language: system
        files: \.(py|cs)$
        pass_filenames: false

    -   id: wasm-lint
        name: Lint WASM-breaking methods
        entry: python3 scripts/fallback_runner.py python3 scripts/lint_wasm.py
        language: system
        files: \.(py|cs)$
        pass_filenames: false

    -   id: doc-coverage
        name: Check 100% Documentation Coverage
        entry: bash -c "test \"$(dotnet run --project scripts/DocCoverage.csproj -- src | tail -n 1)\" = \"100\""
        language: system
        pass_filenames: false

    -   id: build
        name: Build
        entry: python3 scripts/run_slow.py python3 scripts/fallback_runner.py dotnet build CddOpenApi.slnx
        language: system
        pass_filenames: false

    -   id: tests
        name: Run tests
        entry: python3 scripts/run_slow.py python3 scripts/fallback_runner.py dotnet test tests/Cdd.OpenApi.Tests/Cdd.OpenApi.Tests.csproj /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura /p:Threshold=100
        language: system
        pass_filenames: false

    -   id: petstore-tests
        name: Run Petstore Integration Tests
        entry: python3 scripts/run_slow.py python3 scripts/run_petstore_tests.py
        language: system
        pass_filenames: false

    -   id: generated-petstore-tests
        name: Run Generated Petstore Server Tests
        entry: python3 scripts/run_slow.py python3 scripts/run_generated_petstore_tests.py
        language: system
        pass_filenames: false

    -   id: ml-framework-snapshots-grounding
        name: Ground OpenAPI and Arazzo against ../ml-framework-snapshots
        entry: python3 scripts/fallback_runner.py python3 scripts/ground_ml_framework_snapshots.py --snapshots-dir ../ml-framework-snapshots
        language: system
        pass_filenames: false

    -   id: arazzo-conformance-tests
        name: Run Arazzo 1.1.0 End-to-End Conformance Tests
        entry: python3 scripts/run_slow.py python3 scripts/run_arazzo_tests.py
        language: system
        pass_filenames: false
